name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test and build (Node 26)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Keep the Pages site static
        run: |
          test ! -e functions
          ! grep -rnE "[\"'\`]/api/|challenges\.cloudflare\.com" src app.js app-config.js domain-migration.js local-mcp-bridge.js

      - name: Run tests
        run: npm test

      - name: Build the production bundle
        run: npm run build

      - name: Run the editor browser smoke test
        run: npm run test:editor:browser
        env:
          CHROME_PATH: /usr/bin/google-chrome

  companion-minimum-node:
    name: Companion tests (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The published carouselbot package supports Node >=22 (engines.node).
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Run companion tests
        run: npm run test:mcp

  deploy-production:
    name: Deploy production
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://carousel.bot

    steps:
      - name: Check whether deployment credentials are configured
        id: credentials
        env:
          HAS_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          if [[ "$HAS_CLOUDFLARE_API_TOKEN" == "true" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Production deployment skipped until the Cloudflare environment secrets are configured."
          fi

      - name: Check out verified main
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies without lifecycle scripts
        if: steps.credentials.outputs.configured == 'true'
        run: npm ci --ignore-scripts

      - name: Build the production bundle
        if: steps.credentials.outputs.configured == 'true'
        run: npm run build

      - name: Deploy the verified bundle to Cloudflare Pages
        if: steps.credentials.outputs.configured == 'true'
        run: ./node_modules/.bin/wrangler pages deploy dist --project-name slides-editor --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 0013d6c77fa95280762f403d53c52869
